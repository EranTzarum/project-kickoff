    <text x="20" y="66"><tspan fill="#8b949e">$ </tspan>node scripts/preflight.mjs .</text>
    <text x="20" y="96">STAGE 0 INTAKE: <tspan fill="#3fb950" font-weight="bold">READY</tspan></text>
